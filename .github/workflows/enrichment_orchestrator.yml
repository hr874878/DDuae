name: Enrichment Orchestrator

on:
  workflow_run:
    workflows: ["Community"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      date:
        description: "Date to enrich (YYYY-MM-DD). Leave empty for yesterday in Asia/Dubai."
        required: false
        type: string

jobs:
  # ---- Community: 3 groups run one after another ----
  community-a:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/enrichment_group.yml
    with:
      type: community
      group_name: community-a
      categories: "auto-services,consultancy-services,domestic,event-entertainment"
      date: ${{ inputs.date }}
    secrets: inherit

  community-b:
    needs: community-a
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/enrichment_group.yml
    with:
      type: community
      group_name: community-b
      categories: "freelancers,health-wellbeing-services,home-maintenance,movers-removals"
      date: ${{ inputs.date }}
    secrets: inherit

  community-c:
    needs: community-b
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/enrichment_group.yml
    with:
      type: community
      group_name: community-c
      categories: "other-services,restoration-repairs,tutors-classes,web-computer-services"
      date: ${{ inputs.date }}
    secrets: inherit